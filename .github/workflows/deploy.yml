name: CI + Deploy Monitor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar runs anteriores si hacés un nuevo push (ahorra minutos)
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================
  # JOB 1: Validar que el código compila antes de cualquier deploy
  # =====================================================
  validate:
    name: Validate code compiles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-next/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'
          cache-dependency-path: requirements.railway.txt

      # --- Validar frontend (TypeScript + Next.js build) ---
      - name: Install frontend dependencies
        working-directory: web-next
        run: npm ci --no-audit --prefer-offline

      - name: TypeScript check (frontend)
        working-directory: web-next
        run: npx tsc --noEmit

      - name: Build Next.js (frontend)
        working-directory: web-next
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # --- Validar backend (Python syntax + imports) ---
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.railway.txt

      - name: Python syntax check (backend)
        run: |
          python -c "
          import ast, sys
          import os
          errors = []
          for root, dirs, files in os.walk('backend'):
              for f in files:
                  if f.endswith('.py'):
                      p = os.path.join(root, f)
                      try:
                          with open(p, encoding='utf-8') as fh:
                              ast.parse(fh.read())
                      except SyntaxError as e:
                          errors.append(f'{p}: {e}')
          if errors:
              for e in errors: print('FAIL:', e, file=sys.stderr)
              sys.exit(1)
          print(f'OK: {sum(1 for r,_,fs in os.walk(\"backend\") for f in fs if f.endswith(\".py\")} Python files valid')
          "

      - name: Verify backend imports
        run: |
          python -c "
          from backend.api.routers.files import _get_mime_for_key
          print('MIME pdf:', _get_mime_for_key('test.pdf'))
          print('MIME py:', _get_mime_for_key('script.py'))
          print('MIME md:', _get_mime_for_key('README.md'))
          print('MIME json:', _get_mime_for_key('data.json'))
          print('MIME docx:', _get_mime_for_key('file.docx'))
          print('MIME unknown:', _get_mime_for_key('file.xyz'))
          print('OK: backend imports working')
          "

  # =====================================================
  # JOB 2: Monitorear que Railway se deploye (solo en push a main, no PRs)
  # =====================================================
  railway-monitor:
    name: Monitor Railway deployments
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: sha
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Wait for Railway to pick up the deploy
        run: |
          echo "Esperando 30s a que Railway detecte el push..."
          sleep 30

      - name: Check Railway deployment status via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          echo "Verificando deployments para SHA: $SHA"

          # Esperar hasta 5 minutos a que Railway cree el deployment
          for i in {1..30}; do
            DEPLOYMENTS=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/deployments?sha=$SHA&per_page=10" 2>/dev/null)

            RAILWAY_COUNT=$(echo "$DEPLOYMENTS" | grep -c '"creator":{"login":"railway-app\[bot\]"' || echo "0")

            if [ "$RAILWAY_COUNT" -gt "0" ]; then
              echo "Railway creó $RAILWAY_COUNT deployment(s) para este SHA"
              break
            fi

            echo "Intento $i/30: Railway aún no creó deployments. Esperando 10s..."
            sleep 10
          done

          if [ "$RAILWAY_COUNT" = "0" ]; then
            echo "WARNING: Railway no creó deployments para $SHA en 5 minutos"
            echo "Esto puede significar que el auto-deploy está deshabilitado"
            echo "Ve al dashboard de Railway para verificar"
            # No fallamos el job para no romper otros workflows
            exit 0
          fi

      - name: Wait for deployments to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ steps.sha.outputs.sha }}"

          for i in {1..60}; do
            # GitHub status checks (success/failure/pending)
            STATUSES=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/statuses" 2>/dev/null)

            PENDING=$(echo "$STATUSES" | grep -c '"state":"pending"' || echo "0")
            SUCCESS=$(echo "$STATUSES" | grep -c '"state":"success"' || echo "0")
            FAILURE=$(echo "$STATUSES" | grep -c '"state":"failure"' || echo "0")

            echo "[$i/60] pending=$PENDING success=$SUCCESS failure=$FAILURE"

            if [ "$PENDING" = "0" ] && [ "$FAILURE" = "0" ] && [ "$SUCCESS" -gt "0" ]; then
              echo "OK: Todos los deployments de Railway pasaron"
              exit 0
            fi

            if [ "$FAILURE" -gt "0" ]; then
              echo "FAIL: Un deployment de Railway falló"
              echo "$STATUSES" | head -50
              exit 1
            fi

            sleep 5
          done

          echo "TIMEOUT: deployments no terminaron en 5 minutos"
          exit 1

      - name: Smoke test the deployed backend
        if: success()
        run: |
          echo "Probando backend en Railway..."

          # Reintentar hasta 3 veces (el container puede estar reiniciando)
          for i in {1..3}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://backend-production-cabf.up.railway.app/api/v1/health" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "OK: backend responde 200"

              # Verificar que el código nuevo está (MIME type fix)
              HEADERS=$(curl -s -D - -o /dev/null \
                "https://backend-production-cabf.up.railway.app/api/v1/files/download/deploy_test/2026/06/15/e15a7a854518_jarvis-test-deploy.txt" 2>/dev/null)

              if echo "$HEADERS" | grep -q "content-disposition: inline"; then
                echo "OK: Content-Disposition: inline presente (código nuevo)"
              else
                echo "WARNING: Content-Disposition no es 'inline', puede ser código viejo"
              fi

              if echo "$HEADERS" | grep -q "content-type: text/plain"; then
                echo "OK: Content-Type: text/plain (MIME correcto)"
              else
                echo "WARNING: Content-Type no es text/plain"
              fi

              exit 0
            fi

            echo "Intento $i: backend responde $HTTP_CODE, esperando 10s..."
            sleep 10
          done

          echo "FAIL: backend no responde 200 después de 30s"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Railway deployment failed for SHA ${{ steps.sha.outputs.sha }}"
          echo ""
          echo "Posibles causas:"
          echo "  1. Build error en backend → ver logs en Railway dashboard"
          echo "  2. Build error en frontend → 'npm run build' falló"
          echo "  3. Container crasheó al arrancar → ver Deploy Logs en Railway"
          echo ""
          echo "Para forzar un redeploy manual:"
          echo "  Railway dashboard → servicio → Deploy → seleccionar main"
          echo ""
          echo "O hacer un commit vacío:"
          echo "  git commit --allow-empty -m 'chore: trigger redeploy'"
          echo "  git push origin main"
