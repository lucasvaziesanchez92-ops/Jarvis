        const loader = new STLLoader();

        loader.load(stlUri, (geometry) => {
            console.log('STL loaded OK');
            geometry.computeVertexNormals();
            geometry.center();

            const box = new THREE.Box3().setFromObject(new THREE.Mesh(geometry));
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2 / maxDim;

            const brainMesh = new THREE.Mesh(geometry, brainMaterial);
            brainMesh.scale.setScalar(scale);
            brainMesh.rotation.x = -Math.PI / 2;
            brainMesh.rotation.z = Math.PI / 4;
            brainMesh.castShadow = true;
            brainMesh.receiveShadow = true;
            scene.add(brainMesh);

            // Inner glow
            const innerGeo = geometry.clone();
            const innerMesh = new THREE.Mesh(innerGeo, innerMat);
            innerMesh.scale.setScalar(scale * 0.97);
            innerMesh.rotation.copy(brainMesh.rotation);
            scene.add(innerMesh);

            // Animation
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime();

                brainMesh.rotation.x = -Math.PI / 2 + Math.sin(time * 0.15) * 0.05;
                brainMesh.rotation.z = Math.PI / 4 + Math.cos(time * 0.1) * 0.03;
                innerMesh.rotation.copy(brainMesh.rotation);

                // Pulsating glow
                brainMaterial.sheenColor.setHSL(0.92 + Math.sin(time * 0.3) * 0.02, 0.7, 0.6);

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        });

        // Lighting
        scene.add(new THREE.AmbientLight(0x404040, 0.5));

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 5, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        scene.add(new THREE.DirectionalLight(0xff69b4, 0.6));
        scene.add(new THREE.DirectionalLight(0x40e0d0, 0.8));

        const pointLight = new THREE.PointLight(0xff1493, 0.5, 10);
        pointLight.position.set(0, -2, 0);
        scene.add(pointLight);

        const topLight = new THREE.PointLight(0xff69b4, 0.4, 8);
        topLight.position.set(0, 3, 0);
        scene.add(topLight);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
